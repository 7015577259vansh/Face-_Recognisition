<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 720px; margin: 0 auto; padding: 16px; }
  .stage { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #8886; }
  button { cursor: pointer; }
  #status { opacity: .75; font-size: 14px; min-height: 1.2em; }
  li { margin: 6px 0; } li button { margin-left: 8px; padding: 2px 8px; }
</style>
</head>
<body>
<h1>Face Recognition</h1>
<div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="c"></canvas></div>
<p id="status">Loading models…</p>
<div class="row">
  <button id="start" disabled>Start camera</button>
  <button id="check" disabled>Check me</button>
</div>
<div id="addbox" class="row" hidden>
  <input id="name" placeholder="Enter your name">
  <button id="add">Add me to system</button>
  <button id="cancel">Cancel</button>
</div>
<div id="result" style="font-size:18px;font-weight:600;min-height:1.4em"></div>
<h3>Saved people <small id="mode"></small></h3>
<ul id="list"></ul>
<p><small>Only numeric face descriptors are saved (no photos). Register only people who agreed to it.</small></p>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const $ = id => document.getElementById(id);
const MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const opts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
let people = {}, matcher = null, cloud = false, running = false;
const status = t => ($("status").textContent = t);

// ---------- storage: cloud (Vercel + Upstash) with localStorage fallback ----------
async function api(method, body, q = "") {
  const h = { "Content-Type": "application/json" };
  const pin = sessionStorage.getItem("pin"); if (pin) h["x-pin"] = pin;
  const r = await fetch("/api/faces" + q, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) {
    const p = prompt("Enter PIN"); if (!p) throw new Error("PIN required");
    sessionStorage.setItem("pin", p); return api(method, body, q);
  }
  if (!r.ok) throw new Error("API " + r.status);
  return r.json();
}
async function loadPeople() {
  try { const j = await api("GET"); if (j.configured) { cloud = true; people = j.people; } } catch {}
  if (!cloud) { try { people = JSON.parse(localStorage.getItem("faces") || "{}"); } catch { people = {}; } }
  $("mode").textContent = cloud ? "(cloud – shared)" : "(this browser only)";
  refresh();
}
async function savePerson(name, descriptors) {
  people[name] = descriptors;
  if (cloud) await api("POST", { name, descriptors });
  else localStorage.setItem("faces", JSON.stringify(people));
  refresh();
}
async function removePerson(name) {
  delete people[name];
  if (cloud) await api("DELETE", null, "?name=" + encodeURIComponent(name));
  else localStorage.setItem("faces", JSON.stringify(people));
  refresh();
}
function refresh() {
  const labeled = Object.entries(people).map(([n, ds]) =>
    new faceapi.LabeledFaceDescriptors(n, ds.map(d => new Float32Array(d))));
  matcher = labeled.length ? new faceapi.FaceMatcher(labeled, 0.5) : null;
  $("list").innerHTML = "";
  for (const n of Object.keys(people)) {
    const li = document.createElement("li"); li.textContent = n;
    const b = document.createElement("button"); b.textContent = "Delete";
    b.onclick = () => removePerson(n).catch(e => status(e.message));
    li.appendChild(b); $("list").appendChild(li);
  }
}

// ---------- camera + recognition ----------
async function init() {
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODELS),
  ]);
  await loadPeople();
  $("start").disabled = false; status("Ready. Click Start camera.");
}
$("start").onclick = async () => {
  try {
    $("v").srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  } catch { return status("Camera blocked. Allow camera access in the browser and retry."); }
  $("v").onloadedmetadata = () => { running = true; $("check").disabled = false; status("Camera on. Click Check me."); loop(); };
  $("start").disabled = true;
};
async function loop() {
  const v = $("v"), c = $("c");
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext("2d");
  while (running) {
    const dets = await faceapi.detectAllFaces(v, opts()).withFaceLandmarks().withFaceDescriptors();
    ctx.clearRect(0, 0, c.width, c.height);
    for (const d of dets) {
      const m = matcher ? matcher.findBestMatch(d.descriptor) : null;
      const known = m && m.label !== "unknown";
      const { x, y, width, height } = d.detection.box;
      ctx.strokeStyle = known ? "#22c55e" : "#ef4444"; ctx.lineWidth = 3;
      ctx.strokeRect(x, y, width, height);
      ctx.fillStyle = ctx.strokeStyle; ctx.font = "bold 22px system-ui";
      ctx.fillText(known ? m.label : "Unknown", x, Math.max(y - 8, 22));
    }
    await new Promise(r => setTimeout(r, 120));
  }
}
let pending = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function capture(n = 6) {
  const ds = [];
  for (let i = 0; i < n; i++) {
    status(`Scanning ${i + 1}/${n} – look at the camera…`);
    const dets = await faceapi.detectAllFaces($("v"), opts()).withFaceLandmarks().withFaceDescriptors();
    if (dets.length === 1) ds.push(dets[0].descriptor);
    await sleep(450);
  }
  return ds;
}
$("check").onclick = async () => {
  $("check").disabled = true; $("addbox").hidden = true; $("result").textContent = "";
  const ds = await capture();
  $("check").disabled = false;
  if (ds.length < 3) return status("Need exactly one clear face in view. Try again.");
  // vote: which saved person matches most of the scans?
  const votes = {};
  if (matcher) for (const d of ds) { const m = matcher.findBestMatch(d); if (m.label !== "unknown") votes[m.label] = (votes[m.label] || 0) + 1; }
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  if (best && best[1] >= Math.ceil(ds.length / 2)) {
    $("result").textContent = `✅ Welcome back, ${best[0]}! You're already in the system.`;
    status("Match found.");
  } else {
    pending = ds.map(d => Array.from(d));
    $("result").textContent = "❌ Not found in the system.";
    status("Enter your name below to add yourself.");
    $("addbox").hidden = false; $("name").focus();
  }
};
$("add").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return status("Type your name first.");
  if (!pending) return status("Click Check me first.");
  try {
    await savePerson(name, pending);
    $("result").textContent = `✅ Added "${name}" to the system.`;
    status("Saved. Next time Check me will recognise you.");
    $("addbox").hidden = true; $("name").value = ""; pending = null;
  } catch (e) { status("Save failed: " + e.message); }
};
$("cancel").onclick = () => { $("addbox").hidden = true; pending = null; $("result").textContent = ""; };
init().catch(e => status("Failed to load: " + e.message));
</script>
</body>
</html>
